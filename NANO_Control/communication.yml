# NANO 上位机通信配置。
# 下位机 NANO 协议串口由 Code/ChaseNum1_COM.h 的 NANO_PROTOCOL_UART_SELECT 决定。
# 当前工程可在 UART2 / UART7 之间切换，旧 Unified UART3 协议文件仍保留，但不是当前主链路。

serial:
  port: COM8
  baudrate: 115200
  timeout_s: 0.03
  read_sleep_s: 0.01
  print_rx_to_terminal: true
  rx_print_prefix: "[MCU] "

protocol:
  header: [0xAA, 0x55]
  tail: [0x0D, 0x0A]
  version: 0x01
  checksum: "sum(version, seq, module, cmd, len, payload) & 0xFF"
  max_rx_payload_len: 32
  max_tx_payload_len: 64

modules:
  system: 0x01
  chassis: 0x02
  arm: 0x03
  pump: 0x04
  shooter: 0x05

commands:
  system:
    hello: 0x01
    reset: 0x02
    estop: 0x03
    get_status: 0x04
  chassis:
    run: 0x10
    stop: 0x11
    brake: 0x12
    rotate_to: 0x13
    translate_rel: 0x14
    get_state: 0x15
    start_local_pos: 0x16
    get_local_pos: 0x17
    stop_local_pos: 0x18
  arm:
    target_xyz_dir: 0x20
    fold_home: 0x21
    stop_hold: 0x22
    get_pose: 0x23
  pump:
    suck: 0x30
    release: 0x31
    get_state: 0x32
  shooter:
    fire: 0x40
    reset: 0x41
    get_state: 0x42

responses:
  ack: 0x80
  nack: 0x81
  status: 0x82
  event: 0x83
  arm_pose: 0x84
  chassis_state: 0x85
  pump_state: 0x86
  chassis_local_pos: 0x87
  shooter_state: 0x88

payload_formats:
  chassis_run: "<fff"
  chassis_rotate_to: "<ff"
  chassis_translate_rel: "<fff"
  arm_target_xyz_dir: "<ffff"
  ack: "<BBBBB"
  event: "<BBBBB"
  status: "<BBBBBBBBIf"
  status_with_shooter: "<BBBBBBBBIfB"
  chassis_state: "<BBfffff"
  chassis_local_pos: "<ff"
  arm_pose: "<BBBBffffffff"
  pump_state: "<BBBBfBB"
  shooter_state: "<BBBBfhH"

states:
  system: [INIT, RET, IDLE, ACTIVE, ESTOP, FAULT]
  chassis: [IDLE, RUN, ROTATE, TRANSLATE, STOP, BRAKE, FAULT]
  arm: [IDLE, MOVING, FOLDING, HOLD, REJECTED, FAULT]
  pump: [IDLE, SUCKING, SUCKED, RELEASING, RELEASED, FAULT]
  shooter: [IDLE, SPINUP, PUSHING, RETURNING, RESETTING, FAULT]
  movement: [BREAKING, RUNNING, ROTATION, TRANSLATION]

events:
  0x01: SYS_READY
  0x02: SYS_RESET_DONE
  0x03: SYS_ESTOP
  0x10: CHASSIS_ROTATE_DONE
  0x11: CHASSIS_TRANSLATE_DONE
  0x12: CHASSIS_TIMEOUT_STOP
  0x20: ARM_DONE
  0x21: ARM_FOLD_DONE
  0x22: ARM_REJECTED
  0x30: PUMP_SUCK_DONE
  0x31: PUMP_RELEASE_DONE
  0x32: PUMP_TIMEOUT_STOP
  0x40: SHOOTER_DONE
  0x41: SHOOTER_RESET_DONE
  0x42: SHOOTER_TIMEOUT

errors:
  0x00: OK
  0x01: BAD_CMD
  0x02: BAD_LEN
  0x03: BAD_CHECK
  0x04: BAD_STATE
  0x05: BUSY
  0x06: RANGE_LIMIT
  0x07: FORBIDDEN_ZONE
  0x08: TIMEOUT
  0x09: DEVICE

limits:
  chassis:
    run_vx_input_min: -100.0
    run_vx_input_max: 100.0
    run_vy_input_min: -100.0
    run_vy_input_max: 100.0
    run_wz_input_min: -100.0
    run_wz_input_max: 100.0
    run_vxy_internal_nonzero_min: 1.0
    run_vxy_internal_max: 20.0
    run_wz_internal_max: 200.0
    rotate_angle_deg_min: null
    rotate_angle_deg_max: null
    rotate_wz_input_min: 1.0
    rotate_wz_input_max: 100.0
    rotate_wz_internal_min: 1.0
    rotate_wz_internal_max: 10.0
    translate_dx_cm_min: -1000.0
    translate_dx_cm_max: 1000.0
    translate_dy_cm_min: -1000.0
    translate_dy_cm_max: 1000.0
    translate_internal_distance_max: 50000.0
    local_position_unit: cm
    local_position_internal_distance_max: 50000.0
    local_position_cm_max: 1000.0
    local_position_internal_to_cm: 0.02
    translate_speed_input_min: 1.0
    translate_speed_input_max: 100.0
    translate_speed_internal_min: 1.0
    translate_speed_internal_max: 20.0
    run_timeout_ms: 500
  arm:
    world_x_cm_min: null
    world_x_cm_max: null
    world_y_cm_min: null
    world_y_cm_max: null
    world_z_cm_min: null
    world_z_cm_max: null
    suction_dir_deg_min: 0.0
    suction_dir_deg_max: 180.0
  pump:
    release_wait_ms: 500
  shooter:
    pwm_output_pin: PB8
    dir_output_pin: PB7
    dir_forward_level: GPIO_PIN_SET
    pwm_timer: TIM16_CH1
    pwm_period_count: 10000
    pwm_default_duty_count: 6000
    servo_uart: UART5
    servo_uart_tx_pin: PB13
    servo_uart_rx_pin: PB12
    servo_home_pos_0p1deg: 0
    servo_push_pos_0p1deg: 900
    servo_speed_0p1deg_s: 900
    servo_accel: 100
    servo_decel: 100
    servo_power_limit: 0
    spinup_ms: 800
    servo_extra_wait_ms: 300
    reset_extra_wait_ms: 500
    action_timeout_ms: 5000

defaults:
  chassis:
    run_vx: 0.0
    run_vy: 0.0
    run_wz: 0.0
    rotate_angle_deg: 90.0
    rotate_wz: 80.0
    translate_dx_cm: 20.0
    translate_dy_cm: 0.0
    translate_speed: 80.0
  arm:
    world_x_cm: 20.0
    world_y_cm: 0.0
    world_z_cm: 25.0
    suction_dir_deg: 0.0

controller:
  auto_start_reader: true
  wait_timeout_s: 1.0
  event_cache_len: 100
  frame_cache_len: 100
