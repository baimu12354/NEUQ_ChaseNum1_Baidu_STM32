# 上位机统一协议通信参数。
# UART3 同时承载底盘和机械臂指令，旧的单独协议文件暂时保留。
serial:
  baudrate: 115200
  timeout_s: 0.1
  read_sleep_s: 0.01
  encoding: utf-8
  print_rx_to_terminal: true
  rx_print_prefix: "[MCU] "
  max_cached_text_lines: 100
  max_raw_buffer_len: 256

protocol:
  header: [0xAA, 0x55]
  tail: [0x0D, 0x0A]
  version: 0x02
  max_payload_len: 192
  checksum: "sum(version, seq, cmd, len, payload) & 0xFF"

firmware_reply_switches:
  chassis_status_reply_enable: 1
  arm_ack_reply_enable: 1
  arm_unified_response_mode: ARM_HOST_RESPONSE_TEXT

commands:
  hello: 0x01
  get_status: 0x02
  set_feedback: 0x03
  set_yaw: 0x04
  chassis_brake: 0x10
  chassis_run: 0x11
  arm_stop: 0x20
  arm_target: 0x21
  arm_fold: 0x22

responses:
  ack: 0x80
  error: 0x81
  status: 0x82
  text: 0x83
  arm_event: 0x84

payload_formats:
  set_feedback: "<H"
  set_yaw: "<f"
  chassis_run: "<fff"
  arm_target: "<ffff"
  status: "<BBBBfffffffI"
  arm_event: "<BBBBBBBBffffffffI"

command_names:
  0x01: hello
  0x02: get_status
  0x03: set_feedback
  0x04: set_yaw
  0x10: chassis_brake
  0x11: chassis_run
  0x20: arm_stop
  0x21: arm_target
  0x22: arm_fold

response_names:
  0x80: ack
  0x81: error
  0x82: status
  0x83: text
  0x84: arm_event

error_names:
  0x00: NONE
  0x01: BAD_CMD
  0x02: BAD_LEN
  0x03: BAD_CHECK
  0x04: BUSY
  0x05: TIMEOUT
  0x06: REJECTED

arm_event_names:
  0x01: ACCEPTED
  0x02: COMPLETED
  0x03: REJECTED
  0x04: STOPPED
  0x05: PHASE_ERROR

arm_state_names:
  0x00: IDLE
  0x01: RUNNING
  0x02: DONE
  0x03: REJECTED
  0x04: STOPPED
  0x05: ERROR

limits:
  chassis_vx_cm_s: 50.0
  chassis_vy_cm_s: 50.0
  chassis_wz_deg_s: 100.0
  chassis_timeout_ms: 500
  feedback_min_ms: 20
  feedback_max_ms: 1000

arm_defaults:
  world_x_cm: 0.0
  world_y_cm: 30.0
  world_z_cm: 18.0
  suc_dir_deg: 0.0

chassis_defaults:
  vx_cm_s: 0.0
  vy_cm_s: 0.0
  wz_deg_s: 0.0
  feedback_interval_ms: 0

arm_geometry:
  h0_cm: 8.8
  h1_cm: 6.5
  r_cm: 3.0
  l1_cm: 17.5
  c_cm: 2.5
  l2_cm: 20.5
  suction_len_cm: 11.0
  l1_effective_cm: 17.678
  wrist_min_reach_cm: 2.82
  wrist_max_reach_cm: 38.18

arm_servo_mapping:
  s0_gear: 1.0
  s0_dir: 1.0
  s0_offset_deg: 2.0
  s1_gear: 3.0
  s1_dir: 1.0
  s1_offset_deg: -533.0
  s2_gear: 1.0
  s2_dir: -1.0
  s2_offset_deg: -13.0
  s3_gear: 1.0
  s3_dir: -1.0
  s3_offset_deg: -95.0

arm_servo_limits:
  s0_min_deg: -180.0
  s0_max_deg: 180.0
  s1_min_deg: -533.0
  s1_max_deg: 7.0
  s2_min_deg: -90.0
  s2_max_deg: 150.0
  s3_min_deg: -190.0
  s3_max_deg: 10.0

arm_virtual_joint_limits:
  th0_min_deg: -180.0
  th0_max_deg: 178.0
  th1_min_deg: 0.0
  th1_max_deg: 180.0
  th2_min_deg: -163.0
  th2_max_deg: 77.0
  th3_min_deg: -105.0
  th3_max_deg: 95.0

arm_fold_pose:
  default_base_deg: 90.0
  th1_deg: 120.0
  th2_deg: -145.0
  th3_deg: 0.0
  safe_margin_deg: 10.0

front_rod:
  y_cm: 25.0
  radius_cm: 0.5

# 以下是 z>=0 条件下按吸盘方向采样得到的参考工作空间，不是严格矩形边界。
# 实际是否可达以下位机逆解、舵机限位和前方细杆避让判断为准。
arm_sampled_reach_z_ge_0:
  dir_0_deg:   {rho_min_cm: 0.9, rho_max_cm: 41.0, z_min_cm: 0.0,  z_max_cm: 27.2}
  dir_30_deg:  {rho_min_cm: 5.4, rho_max_cm: 46.4, z_min_cm: 0.0,  z_max_cm: 37.9}
  dir_60_deg:  {rho_min_cm: 0.2, rho_max_cm: 50.5, z_min_cm: 0.0,  z_max_cm: 47.2}
  dir_90_deg:  {rho_min_cm: 0.0, rho_max_cm: 52.0, z_min_cm: 0.0,  z_max_cm: 53.4}
  dir_120_deg: {rho_min_cm: 0.0, rho_max_cm: 50.5, z_min_cm: 4.8,  z_max_cm: 58.9}
  dir_150_deg: {rho_min_cm: 0.0, rho_max_cm: 46.4, z_min_cm: 15.6, z_max_cm: 63.0}
  dir_180_deg: {rho_min_cm: 0.0, rho_max_cm: 41.0, z_min_cm: 27.2, z_max_cm: 64.4}
